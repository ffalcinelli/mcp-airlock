name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - v[0-9]+.*
  # Manual runs build and package every target without publishing a release,
  # so the matrix can be checked before tagging.
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag matches the crate version
        run: |
          CRATE_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "v${CRATE_VERSION}" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $CRATE_VERSION"
            exit 1
          fi

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # Release notes: the CHANGELOG section of this version, if there is one.
          awk -v ver="${TAG#v}" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          ARGS=(--title "Release $TAG")
          if [ -s notes.md ]; then ARGS+=(--notes-file notes.md); else ARGS+=(--generate-notes); fi
          if [[ "$TAG" == *-* ]]; then ARGS+=(--prerelease); fi
          gh release create "$TAG" "${ARGS[@]}"

  upload-assets:
    needs: create-release
    # Also runs when create-release is skipped (manual runs).
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            build-tool: cargo-zigbuild
          - target: aarch64-apple-darwin
            os: macos-latest
            build-tool: cargo
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            build-tool: cargo-zigbuild
          - target: x86_64-apple-darwin
            os: macos-latest
            build-tool: cargo
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            build-tool: cargo
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install zigbuild
        if: matrix.build-tool == 'cargo-zigbuild'
        run: pip install cargo-zigbuild

      - name: Build Binary
        shell: bash
        run: |
          if [ "${{ matrix.build-tool }}" = "cargo-zigbuild" ]; then
            cargo zigbuild --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package Binary
        shell: bash
        run: |
          BIN_NAME="mcp-airlock"
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            BIN_NAME="${BIN_NAME}.exe"
          fi
          
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          PKG_NAME="mcp-airlock-${VERSION}-${{ matrix.target }}"
          mkdir -p dist
          
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            cp "target/${{ matrix.target }}/release/${BIN_NAME}" "dist/${BIN_NAME}"
            # Git Bash on the Windows runners has no zip; 7-Zip is preinstalled.
            (cd dist && 7z a -tzip "../${PKG_NAME}.zip" "${BIN_NAME}")
          else
            cp "target/${{ matrix.target }}/release/${BIN_NAME}" "dist/${BIN_NAME}"
            tar -czf "${PKG_NAME}.tar.gz" -C dist "${BIN_NAME}"
          fi

          ASSET=$(ls "${PKG_NAME}".*)
          if command -v sha256sum >/dev/null; then
            sha256sum "$ASSET" > "${ASSET}.sha256"
          else
            shasum -a 256 "$ASSET" > "${ASSET}.sha256"
          fi
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - name: Upload Workflow Artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256

      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" "$ASSET" "${ASSET}.sha256"

  publish-crate:
    needs: upload-assets
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # Trusted publishing (OIDC): crates.io trusts release.yml in the `crates-io` environment.
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
