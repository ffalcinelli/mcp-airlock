name: Documentation

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check for gh-pages
        id: gh-pages
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
          fi

      # gh-pages stores the previously published site, so older versions survive.
      - name: Checkout gh-pages
        if: steps.gh-pages.outputs.exists == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: gh-pages

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Rust Cache
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Determine Version
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=latest" >> $GITHUB_OUTPUT
          fi

      - name: Generate Documentation
        run: |
          RUSTDOCFLAGS="--html-in-header docs-header.html" cargo doc --no-deps --all-features

      - name: Prepare Deployment Artifact
        run: |
          # Initialize deploy dir with existing gh-pages content if it exists
          mkdir -p target/deploy
          if [ -d "gh-pages" ]; then
            cp -r gh-pages/. target/deploy/
            rm -rf target/deploy/.git
          fi
          
          # Add new version
          VERSION_DIR="target/deploy/${{ steps.version.outputs.version }}"
          mkdir -p "$VERSION_DIR"
          cp -r target/doc/* "$VERSION_DIR/"

          # Rebuild any released version whose docs are missing from gh-pages
          for tag in $(git tag -l 'v*'); do
            [ -d "target/deploy/$tag" ] && continue
            echo "::notice::Rebuilding missing docs for $tag"
            git worktree add -q "target/tags/$tag" "$tag"
            if (cd "target/tags/$tag" && RUSTDOCFLAGS="--html-in-header $PWD/docs-header.html" \
                  cargo doc --no-deps --all-features --target-dir "$GITHUB_WORKSPACE/target/tag-doc"); then
              mkdir -p "target/deploy/$tag"
              cp -r target/tag-doc/doc/* "target/deploy/$tag/"
            else
              echo "::warning::Could not build docs for $tag"
            fi
            rm -rf target/tag-doc/doc
            git worktree remove --force "target/tags/$tag"
          done

          # Landing page at the site root (the API docs live under latest/ and v*/)
          cp -r site/. target/deploy/
          
          # Generate versions.json
          echo -n '["latest"' > target/deploy/versions.json
          git tag -l 'v*' | sort -V -r | while read tag; do
            echo -n ", \"$tag\"" >> target/deploy/versions.json
          done
          echo -n ']' >> target/deploy/versions.json

      - name: Save site to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd target/deploy
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${{ steps.version.outputs.version }} docs from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          rm -rf .git

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: 'target/deploy'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
