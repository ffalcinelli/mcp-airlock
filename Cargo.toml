[package]
name = "mcp-airlock"
version = "0.0.1"
edition = "2021"
rust-version = "1.88"
authors = ["Fabio Falcinelli <fabio.falcinelli@gmail.com>"]
description = "Secure 1:1 transparent Layer 7 proxy for the Model Context Protocol (MCP)"
readme = "README.md"
homepage = "https://ffalcinelli.github.io/mcp-airlock/"
documentation = "https://ffalcinelli.github.io/mcp-airlock/latest/mcp_airlock/"
repository = "https://github.com/ffalcinelli/mcp-airlock"
license = "MIT"
keywords = ["mcp", "proxy", "oidc", "fapi", "security"]
categories = ["network-programming", "cryptography"]
include = ["/src", "/benches", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[dependencies]
# Async Runtime
tokio = { version = "1.37", features = ["full"] }
futures = "0.3.30"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Networking & SSE
# rustls (with the OS trust store) instead of native-tls: no system OpenSSL, so the
# release binaries cross-compile, and private CAs configured on the host still work.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots", "charset", "http2", "macos-system-configuration"] }
reqwest-eventsource = "0.6"
eventsource-stream = "0.2"
url = "2.5"

# Security & Auth
keyring = { version = "3.6", features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust", "vendored"] }
p256 = { version = "0.13", features = ["ecdsa"] }
rand_core = { version = "0.6", features = ["std"] }
base64 = "0.22"
uuid = { version = "1.8", features = ["v4"] }
hex = "0.4"
sha2 = "0.10"

# Error Handling & Logging
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
dirs = "6"
open = "5.1"

# Local Loopback Server (for OIDC Callback)
axum = "0.7"

# CLI Parsing
clap = { version = "4.5", features = ["derive", "env"] }
rand = "0.9.3"
html-escape = "0.2.13"
colored = "3.1.1"

[dev-dependencies]
testcontainers = "0.27"
tokio = { version = "1.37", features = ["full", "macros"] }
fantoccini = "0.21"
criterion = "0.8.2"

[[bench]]
name = "crate"
harness = false
